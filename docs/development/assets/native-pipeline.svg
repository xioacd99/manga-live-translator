<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" fill="#f5f7fb"/><style>text{font-family:Arial,Noto Sans CJK SC,sans-serif}</style><text x="36" y="50" font-size="28" font-weight="bold" fill="#18243b">八个可独立优化的算法模块</text><text x="36" y="82" font-size="17" fill="#52627a">开发预览 · 图片只到本机 Python 服务 · 远端只收单独授权的文本</text><rect x="36" y="115" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="53" y="150" font-size="21" font-weight="bold" fill="#18243b">1 · OCR</text><text x="53" y="188" font-size="16" fill="#2c486b">PP-OCRv6 medium · 1536</text><text x="53" y="220" font-size="15" fill="#63728a">Python · 本机 CPU</text><rect x="322" y="115" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="339" y="150" font-size="21" font-weight="bold" fill="#18243b">2 · 气泡检测</text><text x="339" y="188" font-size="16" fill="#2c486b">RT-DETR FP32 · 640</text><text x="339" y="220" font-size="15" fill="#63728a">报告同款权重</text><rect x="608" y="115" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="625" y="150" font-size="21" font-weight="bold" fill="#18243b">3 · 归组 / 顺序</text><text x="625" y="188" font-size="16" fill="#2c486b">包含关系 + XY-cut</text><text x="625" y="220" font-size="15" fill="#63728a">保留行框 / LTR 或 RTL</text><rect x="894" y="115" width="266" height="136" rx="14" fill="#fff5e8" stroke="#ccd5e3"/><text x="911" y="150" font-size="21" font-weight="bold" fill="#18243b">4 · 文本翻译</text><text x="911" y="188" font-size="16" fill="#2c486b">DeepSeek · JSON + ID校验</text><text x="911" y="220" font-size="15" fill="#63728a">单独授权 · 可能计费</text><rect x="36" y="273" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="53" y="308" font-size="21" font-weight="bold" fill="#18243b">5 · 精确缓存</text><text x="53" y="346" font-size="16" fill="#2c486b">内容 SHA + 分阶段修订</text><text x="53" y="378" font-size="15" fill="#63728a">会话内存 · 无私有日志</text><rect x="322" y="273" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="339" y="308" font-size="21" font-weight="bold" fill="#18243b">6 · 邻近预读</text><text x="339" y="346" font-size="16" fill="#2c486b">视口 / 邻近小窗口</text><text x="339" y="378" font-size="15" fill="#63728a">默认关闭 · 有界预算</text><rect x="608" y="273" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="625" y="308" font-size="21" font-weight="bold" fill="#18243b">7 · 背景清理</text><text x="625" y="346" font-size="16" fill="#2c486b">实测纯色安全区域</text><text x="625" y="378" font-size="15" fill="#63728a">复杂背景保留原图</text><rect x="894" y="273" width="266" height="136" rx="14" fill="#ffffff" stroke="#ccd5e3"/><text x="911" y="308" font-size="21" font-weight="bold" fill="#18243b">8 · 自适应排版</text><text x="911" y="346" font-size="16" fill="#2c486b">实测字宽 · 最小12px</text><text x="911" y="378" font-size="15" fill="#63728a">溢出转完整译文卡片</text><text x="36" y="458" font-size="17" fill="#263f5f">安全回退：错字可改、原图可切换，未知背景不强行涂白。</text><text x="36" y="488" font-size="15" fill="#63728a">不是整链路质量保证：真实付费翻译、现代漫画金标准、Mac/M4与真实站点仍需验收。</text></svg>