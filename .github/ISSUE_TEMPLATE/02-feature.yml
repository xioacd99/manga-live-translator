name: Feature request
description: Describe a proposed improvement and how to verify it.
title: '[Feature] '
body:
- type: markdown
  attributes:
    value: 'Please read [the issue guide](https://github.com/xioacd99/manga-live-translator/blob/main/docs/ISSUES.md).
      These requirements apply equally to people and bots. AI-assisted reports are welcome when accurate
      and complete. This is a public tracker: remove secrets, private logs, personal information, and
      private manga content. Use synthetic or shareable minimal examples. Explain unknown or inapplicable
      details instead of guessing.'
- type: textarea
  id: search
  attributes:
    label: Existing issue search
    description: State the search terms and whether a relevant issue already exists. Add new evidence
      there instead of opening a duplicate.
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: Summary
    description: Describe one concrete problem or request. Separate observed facts from assumptions.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Problem and use case
    description: Explain who needs this and the current limitation or inconvenience.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behavior
    description: Describe the desired experience and scope. Clearly mark proposed behavior as not yet
      implemented.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List observable outcomes that would demonstrate success. Avoid unsupported performance
      claims.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Describe other approaches or existing workarounds. If none, explain why.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Additional evidence
    description: Optional sanitized logs, screenshots, links, measurements, or technical analysis. Identify
      hypotheses and disclose anything not verified.
  validations:
    required: false
