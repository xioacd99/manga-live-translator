name: 缺陷报告
description: 报告可复现的问题，包括文档错误。
title: '[缺陷] '
body:
- type: markdown
  attributes:
    value: '请先阅读 [issue 指南](https://github.com/xioacd99/manga-live-translator/blob/dev/docs/ISSUES.md)。所有人员和机器人遵守同一要求，欢迎准确完整的 AI 辅助报告。这里是公开跟踪器，请移除密钥、个人信息、私密日志和私人漫画内容；使用合成或获准公开的最小示例。未知或不适用的内容请解释原因，不要猜测。main 尚未合并中文校验器时，实际提交请遵循指南中的过渡规则。'
- type: textarea
  id: search
  attributes:
    label: 已有 issue 检索
    description: 说明实际使用的搜索词及是否找到相关 issue。优先在已有 issue 中补充新证据，避免重复提交。
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: 概要
    description: 描述一个具体问题或请求，区分观察到的事实与假设。
  validations:
    required: true
- type: textarea
  id: revision
  attributes:
    label: 版本或项目状态
    description: 提供提交 SHA、分支及观察日期，或真实已发布版本。规划或文档问题请说明涉及文件，不要编造应用版本。
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 运行环境
    description: 说明相关操作系统、浏览器版本、配置、源语言和目标语言，以及适用的服务商和模型名称。不要包含凭据。纯文档问题请解释运行环境为何不适用。
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 复现步骤
    description: 提供编号步骤和已脱敏的最小示例。偶发问题请说明频率及已尝试的检查；文档问题请给出文件、小节和定位步骤。
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 预期行为
    description: 描述预期结果及其依据。
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 实际行为
    description: 描述实际观察结果和脱敏后的错误信息，不要声称未运行的测试已通过。
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: 补充证据
    description: 可选：提供脱敏日志、截图、链接、测量或技术分析。明确标记假设和未经验证的内容。
  validations:
    required: false
